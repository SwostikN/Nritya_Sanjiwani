<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Alapadma mark, redrawn for tab sizes. Same petals and bowl as the
       full badge, with three changes that only matter when small:
       the wordmark is dropped, strokes are ~1.6x heavier (the original
       8px lands on a quarter pixel at a 16px tab and greys out), and
       the lower of the two bangle lines is gone — at 32px it merged
       with the bowl into a smudge. The bindu is pulled closer to the
       petals so the mark reads as one object, not a dot and a shape. -->
  <defs>
    <linearGradient id="ns_gold" gradientUnits="userSpaceOnUse" x1="120" y1="420" x2="392" y2="150">
      <stop offset="0" stop-color="#B8791F"/>
      <stop offset=".52" stop-color="#F2CE83"/>
      <stop offset="1" stop-color="#E3A84B"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#0E0A07"/>
  <g transform="translate(256 256) scale(1.22) translate(-256.5 -321)">
    <g fill="none" stroke="url(#ns_gold)" stroke-width="13" stroke-linejoin="round">
      <g transform="rotate(-58 256 396)">
        <path d="M 256 396 C 225.0 309.0 227.8 279.0 256 246.0 C 284.2 279.0 287.0 309.0 256 396 Z"/>
      </g>
      <g transform="rotate(-29 256 396)">
        <path d="M 256 396 C 223.0 290.4 226.0 254.0 256 214.0 C 286.0 254.0 289.0 290.4 256 396 Z"/>
      </g>
      <g transform="rotate(0 256 396)">
        <path d="M 256 396 C 221.0 281.2 224.2 241.6 256 198.0 C 287.8 241.6 291.0 281.2 256 396 Z"/>
      </g>
      <g transform="rotate(29 256 396)">
        <path d="M 256 396 C 223.0 290.4 226.0 254.0 256 214.0 C 286.0 254.0 289.0 290.4 256 396 Z"/>
      </g>
      <g transform="rotate(58 256 396)">
        <path d="M 256 396 C 225.0 309.0 227.8 279.0 256 246.0 C 284.2 279.0 287.0 309.0 256 396 Z"/>
      </g>
    </g>
    <path d="M 166 398 C 200 456 312 456 346 398" fill="none" stroke="url(#ns_gold)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 204 460 C 228 478 284 478 308 460" fill="none" stroke="url(#ns_gold)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="256" cy="166" r="14" fill="#F5DCA8"/>
  </g>
</svg>
